<script>
const DATA=[{"section": "第 1 段 ｜ 00:00–00:05 ｜ 开场：", "en": "Hey hey, good evening everyone, welcome in. You just clicked into the coziest room on this app tonight.", "ipa": "/hˈeɪ hˈeɪ ɡˈʊd ˈiːvnɪŋ ˈɛvɹɪwˌʌn wˈɛlkʌm ˈɪn/\n/juː dʒˈʌst klˈɪkt ˌɪntʊ ðə kˈoʊzɪəst ɹˈuːm ˌɑːn ðɪs ˈæp tənˈaɪt/", "zh": "嗨大家晚上好，欢迎进来。你刚刚点进的，是今晚这个平台上最舒服的一个直播间。"}, {"section": "第 1 段 ｜ 00:00–00:05 ｜ 开场：", "en": "I'm cinnie, and for the next two hours this is your holiday cozy headquarters.", "ipa": "/aɪm sˈɪni ænd fɚðə nˈɛkst tˈuː ˈaɪʊɹz ðɪs ɪz jʊɹ hˈɑːlɪdˌeɪ kˈoʊzi hɛdkwˈɔːɹɾɚz/", "zh": "我是 cinnie，接下来两个小时，这里就是你的节日「舒服基地」。"}, {"section": "第 1 段 ｜ 00:00–00:05 ｜ 开场：", "en": "Outside it's cold, the heat is on, and all you want to do right now is get out of those jeans.", "ipa": "/aʊtsˈaɪd ɪts kˈoʊld ðə hˈiːt ɪz ˈɑːn ænd ˈɔːl juː wˈɑːnt tə dˈuː ɹˈaɪt nˈaʊ ɪz ɡɛt ˌaʊɾəv ðoʊz dʒˈiːnz/", "zh": "外面很冷，暖气开着，你现在最想干的事，就是把那身牛仔裤脱掉。"}, {"section": "第 1 段 ｜ 00:00–00:05 ｜ 开场：", "en": "So tonight, no jeans, no bras that dig in, no stiff holiday outfits you can wear exactly once.", "ipa": "/sˌoʊ tənˈaɪt nˈoʊ dʒˈiːnz nˈoʊ bɹˈɑːz ðæt dˈɪɡ ˈɪn nˈoʊ stˈɪf hˈɑːlɪdˌeɪ ˈaʊtfɪts juː kæn wˈɛɹ ɛɡzˈæktli wˈʌns/", "zh": "所以今晚，不讲牛仔裤、不讲勒人的内衣，也不讲那种只能穿一次的硬挺节日装。"}, {"section": "第 1 段 ｜ 00:00–00:05 ｜ 开场：", "en": "Tonight is loungewear only. Seven pieces, all soft, all gift-ready, and every one arrives in its own zip bag.", "ipa": "/tənˈaɪt ɪz lˈaʊndʒjuːˌɛɹ ˈoʊnli/\n/sˈɛvən pˈiːsɪz ˈɔːl sˈɔft ˈɔːl ɡˈɪftɹˈɛdi ænd ˈɛvɹi wˈʌn ɚɹˈaɪvz ɪn ɪts ˈoʊn zˈɪp bˈæɡ/", "zh": "今晚只讲家居服。七个款，全部柔软、全部能当礼物，而且每一件都是独立拉链袋包装。"}, {"section": "第 1 段 ｜ 00:00–00:05 ｜ 开场：", "en": "If you just walked in, do one thing for me. Tap follow, and drop a heart in the chat so I know you're here.", "ipa": "/ɪf juː dʒˈʌst wˈɔːkt ˈɪn dˈuː wˈʌn θˈɪŋ fɔːɹ mˌiː/\n/tˈæp fˈɑːloʊ ænd dɹˈɑːp ɐ hˈɑːɹt ɪnðə tʃˈæt sˌoʊ aɪ nˈoʊ jʊɹ hˈɪɹ/", "zh": "刚进来的朋友，帮我做一件事。点个关注，然后在评论区打一颗「心」，让我知道你在。"}, {"section": "第 1 段 ｜ 00:00–00:05 ｜ 开场：", "en": "I read every comment. I answer sizing live, and I'  "Robes run roomy, sets run true, pants run generous. Between sizes, robes up, pants down.", "ipa": "/ɹˈoʊbz ɹˈʌn ɹˈuːmi sˈɛts ɹˈʌn tɹˈuː pˈænts ɹˈʌn dʒˈɛnɚɹəs/\n/bɪtwˌiːn sˈaɪzɪz ɹˈoʊbz ˈʌp pˈænts dˈaʊn/", "zh": "睡袍偏宽松，套装按正常码，裤子偏大。在两个码之间：睡袍往上、裤子往下。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "Depends on your house. The red robe is thick, for a cold house. The green one is lighter, for a warm house.", "ipa": "/dɪpˈɛndz ˌɑːn jʊɹ hˈaʊs/\n/ðə ɹˈɛd ɹˈoʊb ɪz θˈɪk fɚɹə kˈoʊld hˈaʊs/\n/ðə ɡɹˈiːn wˈʌn ɪz lˈaɪɾɚ fɚɹə wˈɔːɹm hˈaʊs/", "zh": "看你家。红色睡袍是加厚，给冷房子。浅绿是薄一些，给暖房子。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "If you keep the heat at [温度] and still sleep with a blanket, take the thick one.", "ipa": "/ɪf juː kˈiːp ðə hˈiːt æt ðə tˈɛmpɹɪtʃɚ ænd stˈɪl slˈiːp wɪð ɐ blˈæŋkɪt tˈeɪk ðə θˈɪk wˌʌn/", "zh": "如果你家暖气开到【温度】还盖被子睡，就拿加厚那件。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "Cold water, gentle cycle, hang dry. Heat is what kills this fabric, not water.", "ipa": "/kˈoʊld wˈɔːɾɚ dʒˈɛntəl sˈaɪkəl hˈæŋ dɹˈaɪ/\n/hˈiːt ɪz wʌt kˈɪlz ðɪs fˈæbɹɪk nˌɑːt wˈɔːɾɚ/", "zh": "冷水洗、轻柔档、悬挂晾。毁掉这个面料的是热，不是水。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "Don't put it in the dryer. It will pill, and it will never feel the same again.", "ipa": "/dˈoʊnt pˌʊt ɪɾ ɪnðə dɹˈaɪɚ/\n/ɪt wɪl pˈɪl ænd ɪt wɪl nˈɛvɚ fˈiːl ðə sˈeɪm ɐɡˈɛn/", "zh": "别进烘干机。会起球，而且再也回不到原来的手感。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "It ships out of [美国仓] within [发货时效], and tracking goes to your email, not your DMs.", "ipa": "/ɪt ʃˈɪps ˌaʊɾəv ðə jˌuːˈɛs wˈɛɹhaʊs wɪðˈɪn ænd tɹˈækɪŋ ɡoʊz tə jʊɹ ˈiːmeɪl nˌɑːt jʊɹ dˌiːˈɛm/", "zh": "从【美国仓】发，【发货时效】内出。物流号发邮箱，不发私信。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "I'm not going to promise you a delivery date, because I don't control the carrier. I'll promise the ship date.", "ipa": "/aɪm nˌɑːt ɡˌoʊɪŋ tə pɹˈɑːmɪs juː ɐ dɪlˈɪvɚɹi dˈeɪt bɪkˈʌz aɪ dˈoʊnt kəntɹˈoʊl ðə kˈæɹɪɚ/\n/aɪl pɹˈɑːmɪs ðə ʃˈɪp dˈeɪt/", "zh": "到货日期我不承诺，因为我不控制承运商。发货日期我承诺。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "Yes. [天数] days, no restocking fee, and you keep the zip bag so it ships back clean.", "ipa": "/jˈɛs ðə nˈʌmbɚɹ ʌv dˈeɪz dˈeɪz nˈoʊ ɹɪstˈɑːkɪŋ fˈiː ænd juː kˈiːp ðə zˈɪp bˈæɡ sˌoʊ ɪt ʃˈɪps bˈæk klˈiːn/", "zh": "能。【天数】天，不收手续费，拉链袋留着，寄回来干净。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "Wrong size is the most common return, so tell me your size and I'll pick for you before you pay.", "ipa": "/ɹˈɔŋ sˈaɪz ɪz ðə mˈoʊst kˈɑːmən ɹɪtˈɜːn sˌoʊ tˈɛl mˌiː jʊɹ sˈaɪz ænd aɪl pˈɪk fɔːɹ juː bɪfˌoːɹ juː pˈeɪ/", "zh": "退换最常见的就是尺码不对，所以把尺码告诉我，付款前我帮你选。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "Then buy one piece, not the bundle. The single-piece live price is the entry point.", "ipa": "/ðˈɛn bˈaɪ wˈʌn pˈiːs nˌɑːt ðə bˈʌndəl/\n/ðə sˈɪŋɡəlpˈiːs lˈaɪv pɹˈaɪs ɪz ðɪ ˈɛntɹi pˈɔɪnt/", "zh": "那就买单件，别买组合。单件直播价就是入门门槛。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "One good piece you wear four days a week is cheaper than four things you never wear.", "ipa": "/wˈʌn ɡˈʊd pˈiːs juː wˈɛɹ fˈoːɹ dˈeɪz ɐ wˈiːk ɪz tʃˈiːpɚ ðɐn fˈoːɹ θˈɪŋz juː nˈɛvɚ wˈɛɹ/", "zh": "一件你会一周穿四天的好衣服，比四件你从来不穿的更便宜。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "That's fair, but the live price doesn't hold. It goes back up when I close this room.", "ipa": "/ðæts fˈɛɹ bˌʌt ðə lˈaɪv pɹˈaɪs dˈʌzənt hˈoʊld/\n/ɪt ɡoʊz bˈæk ˌʌp wɛn aɪ klˈoʊz ðɪs ɹˈuːm/", "zh": "可以理解，但直播价不留。我关播它就回去了。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "So if you're thinking about it, put it in the cart now and decide tonight. The cart holds the item, not the price.", "ipa": "/sˌoʊ ɪf jʊɹ θˈɪŋkɪŋ ɐbˈaʊt ɪt pˌʊt ɪɾ ɪnðə kˈɑːɹt nˈaʊ ænd dᵻsˈaɪd tənˈaɪt/\n/ðə kˈɑːɹt hˈoʊldz ðɪ ˈaɪɾəm nˌɑːt ðə pɹˈaɪs/", "zh": "所以如果你在考虑，先放购物车，今晚再决定。购物车留得住商品，留不住价格。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "No. Hold it to the light — you can see my hand, you can't see through it.", "ipa": "/nˈoʊ/\n/hˈoʊld ɪt tə ðə lˈaɪt juː kæn sˈiː maɪ hˈænd juː kˈænt sˈiː θɹˈuː ɪt/", "zh": "不会。对着光举起来——你能看到我的手，但看不透。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "It arrives in its own zip bag, so it presents as-is. You don't need wrapping paper.", "ipa": "/ɪɾ ɚɹˈaɪvz ɪn ɪts ˈoʊn zˈɪp bˈæɡ sˌoʊ ɪt pɹɪzˈɛnts ˌæzˌɪz/\n/juː dˈoʊnt nˈiːd ɹˈæpɪŋ pˈeɪpɚ/", "zh": "它到货就是独立拉链袋，可以直接拿出去。你不用买包装纸。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "If you're not sure of the size, buy two and return the one that doesn't fit.", "ipa": "/ɪf jʊɹ nˌɑːt ʃˈʊɹ ʌvðə sˈaɪz bˈaɪ tˈuː ænd ɹɪtˈɜːn ðə wˈʌn ðæt dˈʌzənt fˈɪt/", "zh": "如果拿不准尺码，就拿两个，不合适的那个退掉。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "If the card isn't opening, refresh once. If it still won't open, go to the shop and search the name of the piece.", "ipa": "/ɪf ðə kˈɑːɹd ˌɪzənt ˈoʊpənɪŋ ɹɪfɹˈɛʃ wˈʌns/\n/ɪf ɪt stˈɪl woʊnt ˈoʊpən ɡˌoʊ tə ðə ʃˈɑːp ænd sˈɜːtʃ ðə nˈeɪm ʌvðə pˈiːs/", "zh": "如果商品卡打不开，刷新一次。还不行，就去店铺里搜这个款的名字。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "If I'm freezing, that's my connection, not your phone. Stay thirty seconds, I'll be right back.", "ipa": "/ɪf aɪm fɹˈiːzɪŋ ðæts maɪ kənˈɛkʃən nˌɑːt jʊɹ fˈoʊn/\n/stˈeɪ θˈɜːɾi sˈɛkəndz aɪl biː ɹˈaɪt bˈæk/", "zh": "如果我卡了，那是我的网，不是你手机的问题。留三十秒，我马上回来。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "Let me do one thing I haven't done yet. Watch this.", "ipa": "/lˈɛt mˌiː dˈuː wˈʌn θˈɪŋ aɪ hˈævənt dˈʌn jˈɛt/\n/wˈɑːtʃ ðˈɪs/", "zh": "我做一件刚才还没做的事。你看这个。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "I'll pull this as far as it goes, and let go. Watch the shape come back.", "ipa": "/aɪl pˈʊl ðɪs æz fˈɑːɹ æz ɪt ɡˈoʊz ænd lˈɛt ɡˈoʊ/\n/wˈɑːtʃ ðə ʃˈeɪp kˈʌm bˈæk/", "zh": "我把它拉到极限，然后松手。看它回不回形。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "Second test, light. You can see my hand, you can't see through it.", "ipa": "/sˈɛkənd tˈɛst lˈaɪt/\n/juː kæn sˈiː maɪ hˈænd juː kˈænt sˈiː θɹˈuː ɪt/", "zh": "第二个测试，光。你看得到我的手，但看不透。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "Now tell me which one you want me to do next, and I'll do it.", "ipa": "/nˈaʊ tˈɛl mˌiː wˌɪtʃ wˈʌn juː wˈɑːnt mˌiː tə dˈuː nˈɛkst ænd aɪl dˈuː ɪt/", "zh": "现在告诉我下一个想让我做哪个，我就做。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "If we don't get to [数量] COZY comments, I'm opening the bag anyway. Somebody is getting these pants tonight.", "ipa": "/ɪf wiː dˈoʊnt ɡɛt tə ðə kwˈɑːntɪɾi kˈoʊzi kˈɑːmɛnts aɪm ˈoʊpənɪŋ ðə bˈæɡ ˈɛnɪwˌeɪ/\n/sˈʌmbɑːdi ɪz ɡˌɛɾɪŋ ðiːz pˈænts tənˈaɪt/", "zh": "如果「COZY」没打到【数量】，我照样开福袋。今晚一定有人拿走这条裤子。"}, {"section": "第 15 段 ｜ 01:50–02:00 ｜ 开最后一个福袋、点名谢人、晚安", "en": "And if you are watching and you have not commented yet, that is the one thing you can do for free.", "ipa": "/ænd ɪf juː ɑːɹ wˈɑːtʃɪŋ ænd juː hɐvnˌɑːt kˈɑːmɛntᵻd jˈɛt ðæt ɪz ðə wˈʌn θˈɪŋ juː kæn dˈuː fɔːɹ fɹˈiː/", "zh": "如果你在看、还没评论，这就是你唯一能白做的动作。"}];
const section=document.getElementById('section'),search=document.getElementById('search'),voiceSel=document.getElementById('voice'),rate=document.getElementById('rate'),rateval=document.getElementById('rateval'),list=document.getElementById('list'),count=document.getElementById('count'),bar=document.getElementById('bar'),status=document.getElementById('status');
let voices=[],current=-1,filtered=[];
const unique=[...new Set(DATA.map(x=>x.section))];section.innerHTML='<option value="全部内容">全部内容</option>'+unique.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function loadVoices(){voices=speechSynthesis.getVoices();let en=voices.filter(v=>/^en(-|_)/i.test(v.lang));voiceSel.innerHTML='';if(!en.length){voiceSel.innerHTML='<option value="">未检测到英语声音（将使用系统默认声音）</option>';return;}en.sort((a,b)=>((b.lang.toLowerCase().includes('us')?1:0)-(a.lang.toLowerCase().includes('us')?1:0)));en.forEach((v,i)=>{let o=document.createElement('option');o.value=v.name;o.textContent=v.name+' · '+v.lang;if(i===0)o.selected=true;voiceSel.appendChild(o)});}
if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}else{status.textContent='当前浏览器不支持语音朗读，请使用最新版 Chrome 或 Edge。';}
function render(){stop();let s=section.value,q=search.value.trim().toLowerCase();filtered=DATA.map((x,i)=>({...x,index:i})).filter(x=>(s==='全部内容'||x.section===s)&&(!q||(x.en+' '+x.zh).toLowerCase().includes(q)));list.innerHTML='';if(!filtered.length){list.innerHTML='<div class="card empty">没有找到匹配内容</div>';count.textContent='0 句';bar.style.width='0';return;}filtered.forEach((x,n)=>{let card=document.createElement('article');card.className='card';card.innerHTML=`<div class="cardhead"><span>${esc(x.section)}</span><span>第 ${n+1} / ${filtered.length} 句</span></div><div class="en">${esc(x.en)}</div><div class="ipa">${esc(x.ipa)}</div><div class="zh">${esc(x.zh)}</div><div class="actions"><button class="play" data-play="${n}">▶ 播放</button><button class="secondary" data-repeat="${n}">↻ 重听</button><button class="light" data-copy="${n}">复制英文</button></div>`;list.appendChild(card)});count.textContent=`当前显示 ${filtered.length} 句 · 全稿共 ${DATA.length} 句`;bar.style.width='0';}
function stop(){if('speechSynthesis'in window)speechSynthesis.cancel();current=-1;document.querySelectorAll('.play').forEach(b=>b.textContent='▶ 播放');}
function speak(n){if(!('speechSynthesis'in window))return;stop();let x=filtered[n];if(!x)return;current=n;let u=new SpeechSynthesisUtterance(x.en);u.lang='en-US';u.rate=parseFloat(rate.value);let v=voices.find(v=>v.name===voiceSel.value)||voices.find(v=>/^en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;u.onstart=()=>{let b=document.querySelector(`[data-play="${n}"]`);if(b)b.textContent='❚❚ 正在朗读';status.textContent='正在朗读当前英文句子…'};u.onend=()=>{let b=document.querySelector(`[data-play="${n}"]`);if(b)b.textContent='▶ 播放';current=-1;status.textContent='朗读结束，可以跟读或点击重听。'};u.onerror=()=>{let b=document.querySelector(`[data-play="${n}"]`);if(b)b.textContent='▶ 播放';current=-1;status.textContent='语音播放失败，请检查设备声音或更换英语声音。'};speechSynthesis.speak(u);}
list.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let n=Number(b.dataset.play??b.dataset.repeat??b.dataset.copy);if(b.dataset.copy!==undefined){navigator.clipboard?.writeText(filtered[n].en);status.textContent='英文句子已复制。';return;}if(b.dataset.repeat!==undefined||b.dataset.play!==undefined)speak(n);});
section.addEventListener('change',render);search.addEventListener('input',render);rate.addEventListener('input',()=>rateval.textContent=Number(rate.value).toFixed(2)+'x');window.addEventListener('beforeunload',stop);render();
</script></body></html>
